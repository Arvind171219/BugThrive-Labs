# Local development. Defaults match docker-compose.yml, so no credentials need to be set.

spring:
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.bugthrive.labs: DEBUG
    org.flywaydb: INFO

app:
  jwt:
    # Local development only — never use this value anywhere else.
    secret: ${JWT_SECRET:dev-only-insecure-jwt-secret-change-me-0123456789abcdef}
