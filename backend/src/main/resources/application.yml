# Shared configuration. Profile-specific overrides live in application-{profile}.yml.
# Every value that differs per environment is read from an environment variable (see .env.example).

spring:
  application:
    name: bugthrive-labs-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bugthrive_labs}}
    username: ${DB_USERNAME:bugthrive}
    password: ${DB_PASSWORD:bugthrive}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway; Hibernate only validates it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

app:
  name: BugThrive Labs API
  version: 0.1.0
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    # Required. HMAC-SHA256 secret, at least 32 bytes. The dev profile supplies a local-only default.
    secret: ${JWT_SECRET:}
    expiration: ${JWT_EXPIRATION:PT1H}
    issuer: bugthrive-labs
  admin:
    # Optional: create this ADMIN account on startup if it doesn't exist.
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    full-name: ${ADMIN_NAME:Platform Admin}
