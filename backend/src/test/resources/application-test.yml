# Test profile: in-memory H2 in PostgreSQL mode, so tests need no running database.

spring:
  datasource:
    url: jdbc:h2:mem:bugthrive_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

app:
  jwt:
    secret: test-only-jwt-secret-for-automated-tests-0123456789
