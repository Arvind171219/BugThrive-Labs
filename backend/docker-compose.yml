# Local PostgreSQL for development only. Credentials match application.yml defaults.
#   docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: bugthrive-labs-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-bugthrive_labs}
      POSTGRES_USER: ${DB_USERNAME:-bugthrive}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bugthrive}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
